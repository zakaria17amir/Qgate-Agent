[project]
name = "qgate-generator"
version = "0.1.0"
description = "Synthetic production line with defect scenarios and ground truth; Python replay producer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "numpy>=2.5,<3",
    "pyyaml>=6,<7",
    "typer>=0.27,<1",
]

[project.scripts]
qgate-gen = "qgate_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_generator"]
