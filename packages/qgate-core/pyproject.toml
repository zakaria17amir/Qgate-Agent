[project]
name = "qgate-core"
version = "0.1.0"
description = "Shared domain models, Avro/Kafka helpers, OTel, logging and auth for qgate-agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "confluent-kafka[avro,schemaregistry]>=2.15,<3",
    "fastavro>=1.12,<2",
    "structlog>=26.1,<27",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "prometheus-client>=0.26,<1",
    "pyjwt>=2.14,<3",
    "httpx>=0.28,<1",
    "tenacity>=9.1,<10",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_core"]
