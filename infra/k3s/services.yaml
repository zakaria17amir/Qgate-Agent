apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
      - name: ingest
        image: ghcr.io/zakaria17amir/qgate-ingest:0.1.0-rc1
        ports:
        - containerPort: 8010
          name: http
        env:
        - name: PORT
          value: '8010'
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qgate-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: postgres://ingest_rw:$(POSTGRES_PASSWORD)@postgres:5432/qgate
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
          initialDelaySeconds: 20
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: schemas
          mountPath: /schemas
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: qgate-config
      volumes:
      - name: tmp
        emptyDir: {}
      - name: schemas
        configMap:
          name: qgate-schemas
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector:
    app: ingest
  ports:
  - port: 8010
    targetPort: http
    name: http
---
