          readOnly: true
        - name: knowledge
          mountPath: /knowledge
          readOnly: true
        - name: cassettes
          mountPath: /cassettes
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        envFrom:
        - configMapRef:
