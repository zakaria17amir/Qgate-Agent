apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: qgate-secrets
  namespace: qgate
spec:
  encryptedData:
    POSTGRES_PASSWORD: <kubeseal output>
    JWT_SECRET: <kubeseal output>
    MES_API_KEY: <kubeseal output>
    LLM_API_KEY: <kubeseal output>
  template:
    metadata:
      name: qgate-secrets
      namespace: qgate
    type: Opaque
