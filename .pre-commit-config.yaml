repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]   # kustomize files hold several objects
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: prettier
        name: prettier (console's own version, same as make lint)
        entry: bash -c 'cd console && npx prettier --write "src/**/*.{ts,tsx,json,css}" "e2e/*.ts" "*.ts"'
        language: system
        files: ^console/.*\.(ts|tsx|json|css)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^services/line-sim/.*\.(cpp|hpp|h)$
