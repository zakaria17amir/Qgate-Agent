# On a version tag: multi-arch images to GHCR with SBOM + provenance, and a GitHub release carrying
# the evaluation report. A tag with a suffix (v0.1.0-rc1) is a pre-release, never "latest".
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # the six Python services share one Dockerfile and differ by workspace package + entrypoint
          - { service: ingest, package: qgate-ingest, entrypoint: ingest }
          - { service: detect, package: qgate-detect, entrypoint: detect }
          - { service: agent, package: qgate-agent, entrypoint: agent }
          - { service: api, package: qgate-api, entrypoint: api }
          - { service: mock-mes, package: qgate-mock-mes, entrypoint: mock-mes }
          - { service: gen, package: qgate-generator, entrypoint: qgate-gen }
          - { service: pipelines, package: qgate-pipelines, entrypoint: prefect }
          - { service: line-sim, dockerfile: services/line-sim/Dockerfile }
          - { service: console, context: ./console, dockerfile: console/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qgate-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile || 'docker/python.Dockerfile' }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            ENTRYPOINT=${{ matrix.entrypoint }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    needs: [images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: eval/report.md
          files: |
            eval/baseline.json
            eval/report.md
            eval/load.json
