# One grouped PR per ecosystem per month; security advisories still open immediately.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      console: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/docker", "/services/*", "/console"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      images: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: docker-compose   # every image: is pinned by digest; this keeps the digests fresh
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      compose-images: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
