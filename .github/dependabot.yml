version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/services/*", "/console", "/pipelines"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
