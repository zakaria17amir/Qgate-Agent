[project]
name = "qgate-agent-workspace"
version = "0.0.0"
description = "End-of-line failure triage and containment agent with a human approval gate"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "packages/qgate-core",
    "packages/qgate-generator",
    "services/ingest",
    "services/detect",
    "services/agent",
    "services/api",
    "services/mock-mes",
    "pipelines",
    "eval/harness",
]

[tool.uv.sources]
qgate-core = { workspace = true }
qgate-generator = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.168,<7",
    "pre-commit>=4.6,<5",
    "pip-audit>=2.10,<3",
    "types-pyyaml>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "services/*/src", "pipelines", "eval/harness"]
extend-exclude = ["docs", "console", "services/line-sim", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/qgate-core/src:packages/qgate-generator/src"
exclude = ["services/line-sim", "console", "infra"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "pipelines", "eval/harness"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external services",
    "integration: needs testcontainers (Postgres, Redpanda)",
    "contract: schemathesis / schema-registry compatibility",
    "eval: golden-case evaluation harness",
    "chaos: fault-injection scenarios against a running stack",
]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["qgate_agent", "qgate_detect", "qgate_ingest"]
branch = true

[tool.coverage.report]
fail_under = 0  # raised to 85 in Phase 1 once agent/detect/ingest have code
show_missing = true
