# qgate-agent — one file, five profiles.
#   core   : the product (line-sim, ingest, detect, agent, api, mock-mes, console) + Redpanda, Postgres
#   obs    : Prometheus, Grafana, Langfuse
#   eval   : Prefect server + worker (pipelines)
#   chaos  : toxiproxy between agent and mock-mes
#   airgap : Ollama for the local-model profile
#
# Image digests are pinned in Phase 5 (release); tags are used while the skeleton is under construction.

name: qgate

x-python-common: &python-common
  env_file: .env
  environment: &python-env
    QGATE_SCHEMAS_DIR: /schemas
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  user: "10001:10001"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-healthcheck-http: &hc-http
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  # ---------------------------------------------------------------- infrastructure
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [core]
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr 0.0.0.0:8081
    ports:
      - "19092:19092"   # kafka, host access
      - "8081:8081"     # schema registry
      - "9644:9644"     # admin / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      <<: *hc-http

  postgres:
    image: postgres:16.4
    profiles: [core]
    environment:
      POSTGRES_DB: qgate
      POSTGRES_USER: qgate_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]   # host-side only; services use the compose network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgate_migrate -d qgate"]
      <<: *hc-http

  migrate:
    image: amacneil/dbmate:2.19
    profiles: [core]
    env_file: .env
    environment:
      DATABASE_URL: postgres://qgate_migrate:${POSTGRES_PASSWORD}@postgres:5432/qgate?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: up
    depends_on:
      postgres: { condition: service_healthy }

  roles:
    image: postgres:16.4
    profiles: [core]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/set_role_passwords.sql:/set_role_passwords.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "qgate_migrate", "-d", "qgate", "-v", "ON_ERROR_STOP=1",
                 "-v", "pw=${POSTGRES_PASSWORD}", "-f", "/set_role_passwords.sql"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ---------------------------------------------------------------- product services
  line-sim:
    build: { context: ., dockerfile: services/line-sim/Dockerfile }
    image: ghcr.io/zakaria17amir/qgate-line-sim:dev
    profiles: [core]
    env_file: .env
    volumes:
      - ./scenarios:/scenarios:ro
      - ./schemas:/schemas:ro
    depends_on:
      redpanda: { condition: service_healthy }
      roles: { condition: service_completed_successfully }

  line-sim-test:
    build: { context: ., dockerfile: services/line-sim/Dockerfile, target: test }
    profiles: [test]

  ingest:
    <<: *python-common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-ingest, ENTRYPOINT: ingest } }
    image: ghcr.io/zakaria17amir/qgate-ingest:dev
    profiles: [core]
    environment:
      <<: *python-env
      DATABASE_URL: postgres://ingest_rw:${POSTGRES_PASSWORD}@postgres:5432/qgate
      PORT: "8010"
    volumes:
      - ./schemas:/schemas:ro
    depends_on:
      redpanda: { condition: service_healthy }
      roles: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/health')"]
      <<: *hc-http

  detect:
    <<: *python-common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-detect, ENTRYPOINT: detect } }
    image: ghcr.io/zakaria17amir/qgate-detect:dev
    profiles: [core]
    command: ["api"]
    environment:
      <<: *python-env
      PORT: "8002"
      DATABASE_URL: postgres://detect_ro:${POSTGRES_PASSWORD}@postgres:5432/qgate
    depends_on:
      roles: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health')"]
      <<: *hc-http

  detect-worker:
    <<: *python-common
    image: ghcr.io/zakaria17amir/qgate-detect:dev
    profiles: [core]
    command: ["worker"]
    environment:
      <<: *python-env
      PORT: "8012"
      DATABASE_URL: postgres://detect_ro:${POSTGRES_PASSWORD}@postgres:5432/qgate
    volumes:
      - ./schemas:/schemas:ro
    depends_on:
      redpanda: { condition: service_healthy }
      roles: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8012/health')"]
      <<: *hc-http

  agent:
    <<: *python-common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-agent, ENTRYPOINT: agent } }
    image: ghcr.io/zakaria17amir/qgate-agent:dev
    profiles: [core]
    environment:
      <<: *python-env
      PORT: "8001"
      DATABASE_URL_AGENT_RO: postgres://agent_ro:${POSTGRES_PASSWORD}@postgres:5432/qgate
      DATABASE_URL_CHECKPOINT_RW: postgres://checkpoint_rw:${POSTGRES_PASSWORD}@postgres:5432/qgate
    volumes:
      - ./knowledge:/knowledge:ro
      - ./schemas:/schemas:ro
      - ./eval/cassettes:/workspace/eval/cassettes
    depends_on:
      redpanda: { condition: service_healthy }
      roles: { condition: service_completed_successfully }
      detect: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      <<: *hc-http

  api:
    <<: *python-common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-api, ENTRYPOINT: api } }
    image: ghcr.io/zakaria17amir/qgate-api:dev
    profiles: [core]
    ports: ["8000:8000"]
    environment:
      <<: *python-env
      DATABASE_URL: postgres://api_rw:${POSTGRES_PASSWORD}@postgres:5432/qgate
    volumes:
      - ./schemas:/schemas:ro
    depends_on:
      redpanda: { condition: service_healthy }
      roles: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      <<: *hc-http

  mock-mes:
    <<: *python-common
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-mock-mes, ENTRYPOINT: mock-mes } }
    image: ghcr.io/zakaria17amir/qgate-mock-mes:dev
    profiles: [core]
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/health')"]
      <<: *hc-http

  console:
    build: { context: ./console, dockerfile: Dockerfile, args: { VITE_API_BASE_URL: "${VITE_API_BASE_URL}" } }
    image: ghcr.io/zakaria17amir/qgate-console:dev
    profiles: [core]
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [obs]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [obs]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  langfuse-db:
    image: postgres:16.4
    profiles: [obs]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2.93.0
    profiles: [obs]
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev-only-change-me
      SALT: dev-only-change-me
      TELEMETRY_ENABLED: "false"
    depends_on: [langfuse-db]

  # ---------------------------------------------------------------- orchestration
  prefect-server:
    image: prefecthq/prefect:3.0.10-python3.12
    profiles: [eval]
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://qgate_migrate:${POSTGRES_PASSWORD}@postgres:5432/prefect
    depends_on:
      postgres: { condition: service_healthy }

  prefect-worker:
    build: { context: ., dockerfile: docker/python.Dockerfile, args: { PACKAGE: qgate-pipelines, ENTRYPOINT: prefect } }
    image: ghcr.io/zakaria17amir/qgate-pipelines:dev
    command: ["worker", "start", "--pool", "qgate", "--type", "process"]
    user: root   # drives the docker socket for replay_scenario
    profiles: [eval]
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # replay_scenario spawns line-sim
      - ./eval:/workspace/eval
    depends_on: [prefect-server]

  # ---------------------------------------------------------------- chaos
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [chaos]
    ports: ["8474:8474"]
    volumes:
      - ./observability/toxiproxy.json:/config/toxiproxy.json:ro
    command: ["-config", "/config/toxiproxy.json", "-host", "0.0.0.0"]

  # ---------------------------------------------------------------- air-gapped
  ollama:
    image: ollama/ollama:0.3.12
    profiles: [airgap]
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  redpanda-data:
  postgres-data:
  prometheus-data:
  langfuse-data:
  ollama-data:
