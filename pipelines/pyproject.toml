[project]
name = "qgate-pipelines"
version = "0.1.0"
description = "Prefect flows: scenario replay, nightly evaluation, report publishing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "prefect>=3.0,<4",
    "prefect-docker>=0.6,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows"]
