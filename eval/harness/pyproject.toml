[project]
name = "qgate-eval"
version = "0.1.0"
description = "Golden-case runner, scorers (escapes, precision, recall, agreement, latency, cost) and report renderer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "qgate-generator",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.3,<4",
    "qgate-mock-mes",
    "qgate-detect",
    "qgate-api",
    "qgate-agent",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "typer>=0.27,<1",
    "rich>=15,<16",
]

[project.scripts]
qgate-eval = "qgate_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qgate_eval"]
