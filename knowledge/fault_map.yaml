# Fault code -> candidate stations. Hand-authored; the agent RANKS these candidates and may not
# add a station that is not listed (validated in the `hypothesise` node). Priors are the
# author's belief before evidence: the measuring station first, one upstream cause second.
# bench_sensitive: a drifting EOL bench can raise this code on good cars.
