[project]
name = "qgate-api"
version = "0.1.0"
description = "Public FastAPI: triage trigger, approval endpoints, audit log, metrics; owns containment state"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "typer>=0.27,<1",
]

[project.scripts]
api = "qgate_api.main:main"
api-cli = "qgate_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_api"]
