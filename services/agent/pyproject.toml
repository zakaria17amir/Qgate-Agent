[project]
name = "qgate-agent"
version = "0.1.0"
description = "LangGraph triage graph with a non-bypassable human approval gate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "langgraph>=0.2.40,<0.3",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "langchain-core>=0.3,<0.4",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-anthropic>=0.2,<0.3",
    "langchain-ollama>=0.2,<0.3",
    "langfuse>=2.50,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "aiosql>=12,<13",
    "pyyaml>=6,<7",
    "uuid7>=0.1,<1",
]

[project.scripts]
agent = "qgate_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_agent"]
