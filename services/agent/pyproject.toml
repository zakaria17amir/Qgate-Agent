[project]
name = "qgate-agent"
version = "0.1.0"
description = "LangGraph triage graph with a non-bypassable human approval gate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-ollama>=1.1,<2",
    "langfuse>=4.15,<5",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pyyaml>=6,<7",
    "uuid7>=0.1,<1",
]

[project.scripts]
agent = "qgate_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_agent"]
