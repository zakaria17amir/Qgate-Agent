[project]
name = "qgate-detect"
version = "0.1.0"
description = "SPC rules, change-point drift onset and gauge capability; HTTP api + Kafka worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "numpy>=2.5,<3",
    "ruptures>=1.1,<2",
    "typer>=0.27,<1",
]

[project.scripts]
detect = "qgate_detect.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_detect"]
