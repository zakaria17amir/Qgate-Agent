[project]
name = "qgate-ingest"
version = "0.1.0"
description = "Consumes line.* topics, validates against the schema registry, upserts genealogy into Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qgate-core",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
ingest = "qgate_ingest.main:main"

[dependency-groups]
test = ["testcontainers[postgres,kafka]>=4.8,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate_ingest"]
